<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" role="img" aria-label="A cycle. AI agents: advisors, Producer, designers, implementer, fix agent and reflection. Deterministic runner code: the build check, the claim check and the commit. Failed checks go to the fix agent and are checked again; verified work moves on to reflection and commit.">
  <defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6e7681"/></marker><marker id="m" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a371f7"/></marker><marker id="c" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4493f8"/></marker><marker id="g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3fb950"/></marker><marker id="w" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d29922"/></marker></defs>
  <rect x="10" y="30" width="160" height="250" rx="14" fill="none" stroke="#30363d" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="24" y="53" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#9198a1">PLAN</text>
  <rect x="194" y="30" width="160" height="250" rx="14" fill="none" stroke="#30363d" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="208" y="53" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#9198a1">DESIGN  ·  OPTIONAL</text>
  <rect x="378" y="30" width="428" height="250" rx="14" fill="none" stroke="#30363d" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="392" y="53" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#9198a1">BUILD AND VERIFY</text>
  <rect x="830" y="30" width="160" height="250" rx="14" fill="none" stroke="#30363d" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="844" y="53" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#9198a1">CLOSE</text><path d="M173 161 H190" fill="none" stroke="#6e7681" stroke-width="1.5" marker-end="url(#a)" /><path d="M357 161 H374" fill="none" stroke="#6e7681" stroke-width="1.5" marker-end="url(#a)" /><path d="M809 161 H826" fill="none" stroke="#3fb950" stroke-width="1.5" marker-end="url(#g)" /><text x="796" y="165" font-size="11.5" font-weight="600" fill="#3fb950" text-anchor="end">verified</text>
  <rect x="20" y="78" width="140" height="62" rx="12" fill="#121d2f" stroke="#4493f8" stroke-width="1.5"/>
  <text x="90" y="106" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">Advisors</text><text x="90" y="124" text-anchor="middle" font-size="12" fill="#9198a1">four separate memos</text>
  <rect x="20" y="190" width="140" height="62" rx="12" fill="#121d2f" stroke="#4493f8" stroke-width="1.5"/>
  <text x="90" y="218" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">Producer</text><text x="90" y="236" text-anchor="middle" font-size="12" fill="#9198a1">sets the objective</text><path d="M90 144 V185" fill="none" stroke="#6e7681" stroke-width="1.5" marker-end="url(#a)" />
  <rect x="204" y="78" width="140" height="62" rx="12" fill="#121d2f" stroke="#4493f8" stroke-width="1.5"/>
  <text x="274" y="106" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">Gameplay</text><text x="274" y="124" text-anchor="middle" font-size="12" fill="#9198a1">Designer</text>
  <rect x="204" y="190" width="140" height="62" rx="12" fill="#121d2f" stroke="#4493f8" stroke-width="1.5"/>
  <text x="274" y="218" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">Sprite</text><text x="274" y="236" text-anchor="middle" font-size="12" fill="#9198a1">Designer</text>
  <rect x="388" y="78" width="120" height="62" rx="12" fill="#121d2f" stroke="#4493f8" stroke-width="1.5"/>
  <text x="448" y="106" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">Implementer</text><text x="448" y="124" text-anchor="middle" font-size="12" fill="#9198a1">changes the game</text>
  <rect x="532" y="78" width="120" height="62" rx="2" fill="#21262d" stroke="#8b949e" stroke-width="1.5"/>
  <text x="592" y="106" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">Build check</text><text x="592" y="124" text-anchor="middle" font-size="12" fill="#9198a1">does it compile?</text>
  <rect x="676" y="78" width="120" height="62" rx="2" fill="#21262d" stroke="#8b949e" stroke-width="1.5"/>
  <text x="736" y="106" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">Claim check</text><text x="736" y="124" text-anchor="middle" font-size="12" fill="#9198a1">claims vs. diff</text>
  <rect x="532" y="190" width="120" height="62" rx="12" fill="#121d2f" stroke="#4493f8" stroke-width="1.5"/>
  <text x="592" y="218" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">Fix agent</text><text x="592" y="236" text-anchor="middle" font-size="12" fill="#9198a1">repairs the change</text><path d="M511 109 H527" fill="none" stroke="#6e7681" stroke-width="1.5" marker-end="url(#a)" /><path d="M655 109 H671" fill="none" stroke="#6e7681" stroke-width="1.5" marker-end="url(#a)" /><path d="M576 144 V185" fill="none" stroke="#d29922" stroke-width="1.5" marker-end="url(#w)" /><path d="M608 186 V145" fill="none" stroke="#d29922" stroke-width="1.5" marker-end="url(#w)" /><text x="568" y="170" font-size="11.5" font-weight="600" fill="#d29922" text-anchor="end">fails</text><text x="616" y="170" font-size="11.5" font-weight="600" fill="#d29922" text-anchor="start">rebuild</text><path d="M736 144 V221 H658" fill="none" stroke="#d29922" stroke-width="1.5" marker-end="url(#w)" /><text x="728" y="213" font-size="11.5" font-weight="600" fill="#d29922" text-anchor="end">mismatch</text>
  <rect x="840" y="78" width="140" height="62" rx="12" fill="#121d2f" stroke="#4493f8" stroke-width="1.5"/>
  <text x="910" y="106" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">Reflection</text><text x="910" y="124" text-anchor="middle" font-size="12" fill="#9198a1">rewrites memory</text>
  <rect x="840" y="190" width="140" height="62" rx="2" fill="#21262d" stroke="#8b949e" stroke-width="1.5"/>
  <text x="910" y="218" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">Commit</text><text x="910" y="236" text-anchor="middle" font-size="12" fill="#9198a1">then release</text><path d="M910 144 V185" fill="none" stroke="#6e7681" stroke-width="1.5" marker-end="url(#a)" /><rect x="212" y="302" width="26" height="18" rx="6" fill="#121d2f" stroke="#4493f8" stroke-width="1.5"/><text x="246" y="315.5" font-size="12.5" fill="#e6edf3"><tspan font-weight="600">AI agent</tspan><tspan fill="#9198a1">  ·  a model call with its own context</tspan></text><rect x="560" y="302" width="26" height="18" rx="1.5" fill="#21262d" stroke="#8b949e" stroke-width="1.5"/><text x="594" y="315.5" font-size="12.5" fill="#e6edf3"><tspan font-weight="600">Runner code</tspan><tspan fill="#9198a1">  ·  deterministic, no AI</tspan></text>
</svg>
