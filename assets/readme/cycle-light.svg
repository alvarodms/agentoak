<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" role="img" aria-label="A cycle: advisors and a Producer plan, optional designers write briefs, an implementer builds, the build and the agent's claims are checked with a fix loop, then reflection rewrites memory and the verified changes are committed">
  <defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker><marker id="m" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8250df"/></marker><marker id="c" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0969da"/></marker><marker id="g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1a7f37"/></marker></defs>
  <rect x="10" y="30" width="160" height="250" rx="14" fill="none" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="24" y="53" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#59636e">PLAN</text>
  <rect x="194" y="30" width="160" height="250" rx="14" fill="none" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="208" y="53" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#59636e">DESIGN  ·  OPTIONAL</text>
  <rect x="378" y="30" width="428" height="250" rx="14" fill="none" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="392" y="53" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#59636e">BUILD AND VERIFY</text>
  <rect x="830" y="30" width="160" height="250" rx="14" fill="none" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="844" y="53" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#59636e">CLOSE</text><path d="M173 161 H190" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)" /><path d="M357 161 H374" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)" /><path d="M809 161 H826" fill="none" stroke="#1a7f37" stroke-width="1.5" marker-end="url(#g)" /><text x="796" y="165" font-size="11.5" font-weight="600" fill="#1a7f37" text-anchor="end">verified</text>
  <rect x="20" y="78" width="140" height="62" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="90" y="106" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Advisors</text><text x="90" y="124" text-anchor="middle" font-size="12" fill="#59636e">four separate memos</text>
  <rect x="20" y="190" width="140" height="62" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="90" y="218" text-anchor="middle" font-size="15" font-weight="600" fill="#1a7f37">Producer</text><text x="90" y="236" text-anchor="middle" font-size="12" fill="#59636e">sets the objective</text><path d="M90 144 V185" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)" />
  <rect x="204" y="78" width="140" height="62" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="274" y="106" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Gameplay</text><text x="274" y="124" text-anchor="middle" font-size="12" fill="#59636e">Designer</text>
  <rect x="204" y="190" width="140" height="62" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="274" y="218" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Sprite</text><text x="274" y="236" text-anchor="middle" font-size="12" fill="#59636e">Designer</text>
  <rect x="388" y="78" width="120" height="62" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="448" y="106" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Implementer</text><text x="448" y="124" text-anchor="middle" font-size="12" fill="#59636e">changes the game</text>
  <rect x="532" y="78" width="120" height="62" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="592" y="106" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Build check</text><text x="592" y="124" text-anchor="middle" font-size="12" fill="#59636e">does it compile?</text>
  <rect x="676" y="78" width="120" height="62" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="736" y="106" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Claim check</text><text x="736" y="124" text-anchor="middle" font-size="12" fill="#59636e">claims vs. diff</text>
  <rect x="532" y="190" width="120" height="62" rx="10" fill="#fbefff" stroke="#8250df" stroke-width="1.5"/>
  <text x="592" y="218" text-anchor="middle" font-size="15" font-weight="600" fill="#8250df">Fix agent</text><text x="592" y="236" text-anchor="middle" font-size="12" fill="#59636e">repairs the change</text><path d="M511 109 H527" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)" /><path d="M655 109 H671" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)" /><path d="M576 144 V185" fill="none" stroke="#8250df" stroke-width="1.5" marker-end="url(#m)" /><path d="M608 186 V145" fill="none" stroke="#8250df" stroke-width="1.5" marker-end="url(#m)" /><text x="568" y="170" font-size="11.5" font-weight="600" fill="#8250df" text-anchor="end">fails</text><text x="616" y="170" font-size="11.5" font-weight="600" fill="#8250df" text-anchor="start">rebuild</text><path d="M736 144 V221 H658" fill="none" stroke="#8250df" stroke-width="1.5" marker-end="url(#m)" /><text x="728" y="213" font-size="11.5" font-weight="600" fill="#8250df" text-anchor="end">mismatch</text>
  <rect x="840" y="78" width="140" height="62" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="910" y="106" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Reflection</text><text x="910" y="124" text-anchor="middle" font-size="12" fill="#59636e">rewrites memory</text>
  <rect x="840" y="190" width="140" height="62" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="910" y="218" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Commit</text><text x="910" y="236" text-anchor="middle" font-size="12" fill="#59636e">then release</text><path d="M910 144 V185" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)" />
</svg>
