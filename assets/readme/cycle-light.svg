  <rect x="676" y="78" width="120" height="62" rx="2" fill="#eaeef2" stroke="#6e7781" stroke-width="1.5"/>
  <text x="736" y="106" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Claim check</text><text x="736" y="124" text-anchor="middle" font-size="12" fill="#59636e">claims vs. diff</text>
  <rect x="532" y="190" width="120" height="62" rx="12" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="592" y="218" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Fix agent</text><text x="592" y="236" text-anchor="middle" font-size="12" fill="#59636e">repairs the change</text><path d="M511 109 H527" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)" /><path d="M655 109 H671" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)" /><path d="M576 144 V185" fill="none" stroke="#9a6700" stroke-width="1.5" marker-end="url(#w)" /><path d="M608 186 V145" fill="none" stroke="#9a6700" stroke-width="1.5" marker-end="url(#w)" /><text x="568" y="170" font-size="11.5" font-weight="600" fill="#9a6700" text-anchor="end">fails</text><text x="616" y="170" font-size="11.5" font-weight="600" fill="#9a6700" text-anchor="start">rebuild</text><path d="M736 144 V221 H658" fill="none" stroke="#9a6700" stroke-width="1.5" marker-end="url(#w)" /><text x="728" y="213" font-size="11.5" font-weight="600" fill="#9a6700" text-anchor="end">mismatch</text>
  <rect x="840" y="78" width="140" height="62" rx="12" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="910" y="106" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Reflection</text><text x="910" y="124" text-anchor="middle" font-size="12" fill="#59636e">rewrites memory</text>
  <rect x="840" y="190" width="140" height="62" rx="2" fill="#eaeef2" stroke="#6e7781" stroke-width="1.5"/>
  <text x="910" y="218" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Commit</text><text x="910" y="236" text-anchor="middle" font-size="12" fill="#59636e">then release</text><path d="M910 144 V185" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)" /><rect x="212" y="302" width="26" height="18" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="246" y="315.5" font-size="12.5" fill="#1f2328"><tspan font-weight="600">AI agent</tspan><tspan fill="#59636e">  ·  a model call with its own context</tspan></text><rect x="560" y="302" width="26" height="18" rx="1.5" fill="#eaeef2" stroke="#6e7781" stroke-width="1.5"/><text x="594" y="315.5" font-size="12.5" fill="#1f2328"><tspan font-weight="600">Runner code</tspan><tspan fill="#59636e">  ·  deterministic, no AI</tspan></text>
</svg>
