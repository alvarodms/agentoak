<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" role="img" aria-label="A cycle. AI agents: advisors, Producer, designers, implementer, fix agent and reflection. Deterministic runner code: the build check, the claim check and the commit. Failed checks go to the fix agent and are checked again; verified work moves on to reflection and commit.">
  <defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker><marker id="m" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8250df"/></marker><marker id="c" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0969da"/></marker><marker id="g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1a7f37"/></marker><marker id="w" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9a6700"/></marker></defs>
  <rect x="10" y="30" width="160" height="250" rx="14" fill="none" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="24" y="53" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#59636e">PLAN</text>
  <rect x="194" y="30" width="160" height="250" rx="14" fill="none" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="208" y="53" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#59636e">DESIGN  ·  OPTIONAL</text>
  <rect x="378" y="30" width="428" height="250" rx="14" fill="none" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="392" y="53" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#59636e">BUILD AND VERIFY</text>
  <rect x="830" y="30" width="160" height="250" rx="14" fill="none" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="844" y="53" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#59636e">CLOSE</text><path d="M173 161 H190" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)" /><path d="M357 161 H374" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)" /><path d="M809 161 H826" fill="none" stroke="#1a7f37" stroke-width="1.5" marker-end="url(#g)" /><text x="796" y="165" font-size="11.5" font-weight="600" fill="#1a7f37" text-anchor="end">verified</text>
  <rect x="20" y="78" width="140" height="62" rx="12" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="90" y="106" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Advisors</text><text x="90" y="124" text-anchor="middle" font-size="12" fill="#59636e">four separate memos</text>
  <rect x="20" y="190" width="140" height="62" rx="12" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="90" y="218" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Producer</text><text x="90" y="236" text-anchor="middle" font-size="12" fill="#59636e">sets the objective</text><path d="M90 144 V185" fill="none" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)" />
  <rect x="204" y="78" width="140" height="62" rx="12" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="274" y="106" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Gameplay</text><text x="274" y="124" text-anchor="middle" font-size="12" fill="#59636e">Designer</text>
  <rect x="204" y="190" width="140" height="62" rx="12" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="274" y="218" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Sprite</text><text x="274" y="236" text-anchor="middle" font-size="12" fill="#59636e">Designer</text>
  <rect x="388" y="78" width="120" height="62" rx="12" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="448" y="106" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Implementer</text><text x="448" y="124" text-anchor="middle" font-size="12" fill="#59636e">changes the game</text>
