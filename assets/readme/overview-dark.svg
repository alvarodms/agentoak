  <rect x="22" y="44" width="156" height="72" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="100" y="76" text-anchor="middle" font-size="16" font-weight="600" fill="#e6edf3">Schedule</text>
