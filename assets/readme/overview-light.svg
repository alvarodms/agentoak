<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 372" width="980" height="372" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" role="img" aria-label="Agent Oak overview: a scheduled cycle is verified, committed and released; memory and community feedback loop back into the next cycle">
  <defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker><marker id="m" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8250df"/></marker><marker id="c" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0969da"/></marker></defs>
  <rect x="22" y="44" width="156" height="72" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="100" y="76" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2328">Schedule</text>
  <text x="100" y="96" text-anchor="middle" font-size="12.5" fill="#59636e">every 4 hours</text><line x1="182" y1="80" x2="212" y2="80" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="217" y="44" width="156" height="72" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="295" y="76" text-anchor="middle" font-size="16" font-weight="600" fill="#1a7f37">Cycle</text>
  <text x="295" y="96" text-anchor="middle" font-size="12.5" fill="#59636e">a team of agents</text><line x1="377" y1="80" x2="407" y2="80" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="412" y="44" width="156" height="72" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="490" y="76" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2328">Verify</text>
  <text x="490" y="96" text-anchor="middle" font-size="12.5" fill="#59636e">build + claim check</text><line x1="572" y1="80" x2="602" y2="80" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="607" y="44" width="156" height="72" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="685" y="76" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2328">Commit</text>
