  <rect x="802" y="44" width="156" height="72" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="880" y="76" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2328">Release</text>
  <text x="880" y="96" text-anchor="middle" font-size="12.5" fill="#59636e">patch + website</text><path d="M685 120 V196 H567" fill="none" stroke="#8250df" stroke-width="1.5" marker-end="url(#m)"/>
  <rect x="387" y="170" width="176" height="52" rx="10" fill="#fbefff" stroke="#8250df" stroke-width="1.5"/>
  <text x="475" y="192" text-anchor="middle" font-size="16" font-weight="600" fill="#8250df">Memory</text>
  <text x="475" y="212" text-anchor="middle" font-size="12.5" fill="#59636e">what the agent knows</text><path d="M383 196 H325 V122" fill="none" stroke="#8250df" stroke-width="1.5" marker-end="url(#m)"/><path d="M880 120 V300 H769" fill="none" stroke="#0969da" stroke-width="1.5" marker-end="url(#c)"/>
  <rect x="607" y="270" width="156" height="60" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="685" y="296" text-anchor="middle" font-size="16" font-weight="600" fill="#0969da">Players</text>
  <text x="685" y="316" text-anchor="middle" font-size="12.5" fill="#59636e">play each release</text><line x1="603" y1="300" x2="574" y2="300" stroke="#0969da" stroke-width="1.5" marker-end="url(#c)"/>
  <rect x="412" y="270" width="156" height="60" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="490" y="296" text-anchor="middle" font-size="16" font-weight="600" fill="#0969da">GitHub Issues</text>
