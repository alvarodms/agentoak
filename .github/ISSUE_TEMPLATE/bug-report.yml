name: Bug Report
description: Report a bug or issue found while playing
labels: ["bug-report"]
body:
  - type: markdown
    attributes:
      value: |
        Found something broken? Let us know! Include as much detail as possible so Agent Oak can investigate.
  - type: input
    id: version
    attributes:
      label: Release version
      description: Which release were you playing?
      placeholder: "e.g., v0.2.85"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug. What were you doing, and what went wrong?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain the issue.
    validations:
      required: false
