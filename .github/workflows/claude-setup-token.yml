name: Claude Setup Token (Ad-hoc)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup-token:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run claude setup-token
        run: |
          echo "Running claude setup-token..."
          claude setup-token || true
          echo "Command completed."
