name: Agent Oak Cycle

on:
  # Manual trigger with optional config overrides
  workflow_dispatch:
    inputs:
      model:
        description: "Claude model to use"
        required: false
        default: "claude-sonnet-4-6"
      max_tool_calls:
        description: "Max tool calls per cycle"
        required: false
        default: "50"

  # Run every 8 hours automatically
  schedule:
    - cron: "0 */8 * * *"

# Prevent concurrent cycles from racing on commits
concurrency:
  group: agent-cycle
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_MODEL: ${{ inputs.model || 'claude-sonnet-4-20250514' }}
      MAX_TOOL_CALLS_PER_CYCLE: ${{ inputs.max_tool_calls || '50' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPO: ${{ github.repository }}
      BASE_ROM_URL: ${{ secrets.BASE_ROM_URL }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || '' }}
      DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL || '' }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || '' }}
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch full history for git operations
        run: git fetch --unshallow origin main 2>/dev/null || true

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Node dependencies
        run: npm i

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Cache ARM toolchain
        id: cache-arm
        uses: actions/cache@v4
        with:
          path: ~/arm-toolchain
          key: arm-toolchain-${{ runner.os }}-v1

      - name: Install ARM toolchain & build deps
        if: steps.cache-arm.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev
          # Snapshot installed files for cache
          mkdir -p ~/arm-toolchain
          dpkg -L gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev | \
            grep -E '^/(usr|lib)' | sort -u | \
            rsync -a --files-from=- / ~/arm-toolchain/

      - name: Restore ARM toolchain from cache
        if: steps.cache-arm.outputs.cache-hit == 'true'
        run: sudo rsync -a ~/arm-toolchain/ /

      - name: Cache agbcc
        id: cache-agbcc
        uses: actions/cache@v4
        with:
          path: pokeemerald/tools/agbcc
          key: agbcc-${{ runner.os }}-v1

      - name: Build & install agbcc
        if: steps.cache-agbcc.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/pret/agbcc.git /tmp/agbcc
          cd /tmp/agbcc
          ./build.sh
          ./install.sh "${{ github.workspace }}/pokeemerald"

      - name: Cache Flatpak installation
        id: cache-flatpak
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/flatpak
            /var/lib/flatpak
          key: flatpak-flips-${{ runner.os }}-v1

      - name: Install Flips (IPS patcher) via Flatpak
        if: steps.cache-flatpak.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y -qq flatpak
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install --noninteractive flathub com.github.Alcaro.Flips

      - name: Configure git identity
        run: |
          git config user.name "Agent Oak [bot]"
          git config user.email "agent-oak[bot]@users.noreply.github.com"

      - name: Cache RTK binary
        id: cache-rtk
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/rtk
          key: rtk-${{ runner.os }}-v1

      - name: Install RTK (Rust Token Killer)
        if: steps.cache-rtk.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://raw.githubusercontent.com/rtk-ai/rtk/refs/heads/master/install.sh | sh

      - name: Register RTK hook with Claude Code
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          rtk init -g --auto-patch

      - name: Run agent cycle (attempt 1)
        id: attempt1
        continue-on-error: true
        run: npm run cycle

      - name: Retry after 5min (attempt 2)
        id: attempt2
        if: steps.attempt1.outcome == 'failure'
        continue-on-error: true
        run: |
          echo "Attempt 1 failed. Waiting 5 minutes before retry..."
          sleep 300
          npm run cycle

      - name: Retry after 15min (attempt 3)
        if: steps.attempt1.outcome == 'failure' && steps.attempt2.outcome == 'failure'
        run: |
          echo "Attempt 2 failed. Waiting 15 minutes before final retry..."
          sleep 900
          npm run cycle

      - name: Push changes
        run: |
          # Push only if there are new commits
          if git diff --quiet origin/main..HEAD; then
            echo "No new commits to push"
          else
            git push origin main
          fi

  deploy-docs:
    needs: run-cycle
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Node dependencies
        run: npm i

      - name: Build docs data
        run: npm run build:docs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
