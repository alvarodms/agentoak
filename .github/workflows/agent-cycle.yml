name: Agent Oak Cycle

on:
  # Manual trigger with optional config overrides
  workflow_dispatch:
    inputs:
      model:
        description: "Claude model to use"
        required: false
        default: "claude-opus-4-6"
      max_tool_calls:
        description: "Max tool calls per cycle"
        required: false
        default: "100"

  # Run every 8 hours automatically
  schedule:
    - cron: "0 */8 * * *"

# Prevent concurrent cycles from racing on commits
concurrency:
  group: agent-cycle
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
  packages: read

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/agentoak-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_MODEL: ${{ inputs.model || 'claude-sonnet-4-20250514' }}
      MAX_TOOL_CALLS_PER_CYCLE: ${{ inputs.max_tool_calls || '100' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPO: ${{ github.repository }}
      BASE_ROM_URL: ${{ secrets.BASE_ROM_URL }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || '' }}
      DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL || '' }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || '' }}
      IS_SANDBOX: 1 # Bypass "--dangerously-skip-permissions cannot be used with root/sudo privileges for security reasons"
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch full history for git operations
        run: git fetch --unshallow origin main 2>/dev/null || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Node dependencies
        run: npm i

      - name: Install Claude Code CLI
        run: |
          npm install -g @anthropic-ai/claude-code

      - name: Copy agbcc into workspace
        run: |
          mkdir -p ${{ github.workspace }}/pokeemerald/tools/agbcc
          cp -r /opt/agbcc/* ${{ github.workspace }}/pokeemerald/tools/agbcc

      - name: Cache base ROM
        uses: actions/cache@v4
        with:
          path: artifacts/base-rom/base.gba
          key: base-rom-f3ae088181bf583e55daf962a92bb46f4f1d07b7

      - name: Configure git identity
        run: |
          echo "In directory: $(pwd)"
          git config --global --add safe.directory $GITHUB_WORKSPACE
          git config user.name "Agent Oak [bot]"
          git config user.email "agent-oak[bot]@users.noreply.github.com"

      - name: Register RTK hook with Claude Code
        run: rtk init -g --auto-patch

      - name: Run agent cycle (attempt 1)
        id: attempt1
        continue-on-error: true
        run: npm run cycle

      - name: Retry - Attempt 2
        id: attempt2
        if: steps.attempt1.outcome == 'failure'
        continue-on-error: true
        run: |
          echo "Attempt 1 failed. Waiting 60 seconds before retry..."
          sleep 60
          npm run cycle

      - name: Retry - Attempt 3 (final)
        if: steps.attempt1.outcome == 'failure' && steps.attempt2.outcome == 'failure'
        run: |
          echo "Attempt 2 failed. Waiting 60 seconds before final retry..."
          sleep 60
          npm run cycle

      - name: Push changes
        run: |
          # Push only if there are new commits
          if git diff --quiet origin/main..HEAD; then
            echo "No new commits to push"
          else
            git push origin main
          fi

      - name: Log RTK stats
        run: rtk gain || echo "Failed to get RTK stats"

  deploy-docs:
    needs: run-cycle
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Node dependencies
        run: npm i

      - name: Build docs data
        run: npm run build:docs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
