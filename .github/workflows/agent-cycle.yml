name: Agent Oak Cycle

on:
  # Manual trigger with optional config overrides
  workflow_dispatch:
    inputs:
      model:
        description: "Claude model to use"
        required: false
        default: "claude-opus-5-5"
      max_tool_calls:
        description: "Max tool calls per cycle"
        required: false
        default: "100"
      risk_tolerance:
        description: "Personality: risk tolerance (0-100, default from personality.json)"
        required: false
      community_openness:
        description: "Personality: community openness (0-100, default from personality.json)"
        required: false
      ambition_level:
        description: "Personality: ambition level (0-100, default from personality.json)"
        required: false

  # Run every 4 hours automatically
  schedule:
    - cron: "0 */4 * * *"

# Prevent concurrent cycles from racing on commits
concurrency:
  group: agent-cycle
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  pages: write
  id-token: write
  packages: read

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/agentoak-runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_MODEL: ${{ inputs.model || 'claude-opus-5-5' }}
      MAX_TOOL_CALLS_PER_CYCLE: ${{ inputs.max_tool_calls || '100' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPO: ${{ github.repository }}
      BASE_ROM_URL: ${{ secrets.BASE_ROM_URL }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || '' }}
      DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL || '' }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || '' }}
      OAK_RISK_TOLERANCE: ${{ inputs.risk_tolerance || '' }}
      OAK_COMMUNITY_OPENNESS: ${{ inputs.community_openness || '' }}
      OAK_AMBITION_LEVEL: ${{ inputs.ambition_level || '' }}
      IS_SANDBOX: 1 # Bypass "--dangerously-skip-permissions cannot be used with root/sudo privileges for security reasons"
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch full history for git operations
        run: git fetch --unshallow origin main 2>/dev/null || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Node dependencies
        run: npm i

      # Pinned: the runner parses the CLI's stream-json output and relies on its
      # flags, so upgrades should be deliberate. Verified against 2.1.308.
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.308

      - name: Copy agbcc into workspace
        run: |
          mkdir -p $GITHUB_WORKSPACE/pokeemerald/tools/agbcc
          cp -r /opt/agbcc/* $GITHUB_WORKSPACE/pokeemerald/tools/agbcc
          echo $(ls -la /opt/agbcc)
          echo $(ls -la $GITHUB_WORKSPACE/pokeemerald/tools/agbcc)

      - name: Cache base ROM
        uses: actions/cache@v4
        with:
          path: artifacts/base-rom/base.gba
          key: base-rom-v1

      - name: Configure git identity
        run: |
          echo "In directory: $(pwd)"
          git config --global --add safe.directory $GITHUB_WORKSPACE
          git config user.name "Agent Oak [bot]"
          git config user.email "agent-oak[bot]@users.noreply.github.com"

      - name: Run agent cycle (attempt 1)
        id: attempt1
        continue-on-error: true
        run: npm run cycle

      - name: Retry - Attempt 2
        id: attempt2
        if: steps.attempt1.outcome == 'failure'
        continue-on-error: true
        run: |
          echo "Attempt 1 failed. Waiting 60 seconds before retry..."
          sleep 60
          npm run cycle

      - name: Retry - Attempt 3 (final)
        if: steps.attempt1.outcome == 'failure' && steps.attempt2.outcome == 'failure'
        run: |
          echo "Attempt 2 failed. Waiting 60 seconds before final retry..."
          sleep 60
          npm run cycle

      # main can move while a cycle runs (merged PRs, manual pushes), so a
      # plain push gets rejected as non-fast-forward. Merge the new main in
      # and retry. Merge rather than rebase: the cycle has already published
      # its commit SHA (sprite feedback image URLs, release notes), and a
      # rebase would orphan it.
      - name: Push changes
        run: |
          if [ "$(git rev-list --count origin/main..HEAD)" -eq 0 ]; then
            echo "No new commits to push"
            exit 0
          fi

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push rejected (attempt $attempt); merging latest origin/main..."
            git fetch origin main
            if ! git merge --no-edit origin/main -m "Merge origin/main into agent cycle"; then
              git merge --abort || true
              break
            fi
            sleep $((attempt * 5))
          done

          # Could not land on main: park the cycle's commits on a branch and
          # open a PR for it so the work survives for a manual merge, then
          # fail the run.
          rescue="cycle-rescue/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git push origin "HEAD:refs/heads/$rescue"

          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(RESCUE="$rescue" RUN_URL="$run_url" SUBJECT="$(git log -1 --format=%s HEAD)" node -e '
            const { RESCUE, RUN_URL, SUBJECT } = process.env;
            process.stdout.write(JSON.stringify({
              title: `Rescue: ${SUBJECT}`,
              head: RESCUE,
              base: "main",
              body: `The [agent cycle run](${RUN_URL}) could not push to main: merging the latest main conflicted with the cycle commits, or the push kept being rejected.\n\nResolve the conflicts on this branch and merge to keep the cycle work.`,
            }));
          ')
          pr_url=""
          if response=$(curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls" \
            -d "$payload"); then
            pr_url=$(RESPONSE="$response" node -e 'console.log(JSON.parse(process.env.RESPONSE).html_url ?? "")')
          else
            echo "Opening the rescue PR failed: $response"
          fi

          if [ -n "$pr_url" ]; then
            echo "::error::Could not push to main. Cycle commits saved to branch $rescue and opened as $pr_url — resolve and merge it."
          else
            echo "::error::Could not push to main, and opening a PR failed. Cycle commits saved to branch $rescue — merge it manually."
          fi
          exit 1

  deploy-docs:
    needs: run-cycle
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install root dependencies
        run: npm i

      - name: Install docs dependencies
        run: cd docs && npm i

      - name: Fetch release data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p docs/public/data
          node docs/build-scripts/build-releases.mjs

      - name: Build docs site
        run: cd docs && npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
